[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superradiant-assistant"
version = "0.0.1"
description = "Agentic orchestration layer for cavity-based AMO experiments at MIT"
authors = [{name = "Matthew Radzihovsky", email = "mattradz@mit.edu"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "h5py", "pandas", "pydantic", "matplotlib"]

[tool.setuptools.packages.find]
include = ["superradiant_assistant*"]